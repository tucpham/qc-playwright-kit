# QC regression pipeline for GitLab (template). Copy to .gitlab-ci.yml or `include:` it.
# Same flow as .github/workflows/qc-regression.yml.
# CI/CD variables: TEST_ENV, ADMIN_USER, ADMIN_PASS, USER_USER, USER_PASS (masked)
# Nightly: create a pipeline schedule with variable QC_GATE=nightly.
# Release: run pipeline manually with QC_GATE=release.

image: mcr.microsoft.com/playwright:v1.64.1-noble

variables:
  CI: 'true'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

cache:
  key: { files: [package-lock.json] }
  paths: [.npm/]

stages: [verify, stabilize, e2e]

.install: &install
  - npm ci

verify:
  stage: verify
  script:
    - *install
    - npm run typecheck
    - npm run lint
    - npm run trace:check
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        case ",$CI_MERGE_REQUEST_LABELS," in *,qc-approved,*) export QC_APPROVED=1;; esac
        npm run guard -- --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      fi
  artifacts:
    when: always
    paths: [metrics/traceability.json]

stabilize:
  stage: stabilize
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - *install
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - npm run stabilize:changed -- --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --runs 5
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths: [playwright-report, test-results]

e2e:
  stage: e2e
  script:
    - *install
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then GREP="@smoke"; GATE="pr";
      else GREP="${QC_GREP:-@regression}"; GATE="${QC_GATE:-nightly}"; fi
    - npx playwright test --grep "$GREP" || true
    - npm run metrics -- --gate "$GATE"
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: test-results/junit.xml
    paths: [playwright-report, test-results/results.json, metrics]
